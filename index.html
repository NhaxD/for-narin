<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#1e1133">
<title>A quest for Narin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Pixelify+Sans:wght@400;600&display=swap" rel="stylesheet">
<style>
/* VOICE: cute, shy, playful — a tiny 8-bit love game made by hand
   IDEA: a pink handheld console playing a one-level RPG: Hongly walks to Narin and asks the big question
   PICTURE: a pixel sunset park (moon, stars, tree, fireflies) with two pixel people; hearts and fireworks on YES
   COLOUR and TYPE: night plum ground, bubblegum pink console, navy dialog box, hot pink + butter yellow accents; Press Start 2P + Pixelify Sans
   LAYOUT: one console centred on one screen: player bar, game screen, dialog box, buttons */
:root{color-scheme:dark;--bg:#1e1133;--shell:#ff8fc0;--shell-d:#e0609e;--bezel:#3b2140;--box:#1b1440;--ink:#fff7fb;--acc:#ff3f8e;--sun:#ffd96a;--mint:#8ff0c8}
*{box-sizing:border-box;min-width:0}
html,body{height:100%}
body{margin:0;color:var(--ink);font:17px/1.5 "Pixelify Sans",ui-rounded,system-ui,sans-serif;overflow-x:clip;
  background:radial-gradient(circle at 20% 15%,#3a1d5c 0,transparent 45%),radial-gradient(circle at 85% 90%,#4a1846 0,transparent 40%),var(--bg);
  display:grid;place-items:center;min-height:100dvh;padding:18px 12px}
.shell{width:min(460px,100%);background:var(--shell);border-radius:26px 26px 26px 60px;padding:16px 16px 22px;
  box-shadow:inset 0 -8px 0 var(--shell-d),inset 0 4px 0 #ffc2dd,0 24px 60px rgba(0,0,0,.45)}
.bar{display:flex;justify-content:space-between;align-items:center;gap:8px;font:13px/1.2 "Press Start 2P",monospace;color:#5a1838;margin:2px 4px 12px}
.bar b{color:#fff;text-shadow:2px 2px 0 var(--shell-d)}
#snd{font:inherit;font-size:13px;color:#5a1838;background:#ffd0e6;border:0;border-radius:8px;padding:0 10px;min-height:44px;cursor:pointer;box-shadow:inset 0 -3px 0 #f2a6c8}
.bezel{background:var(--bezel);border-radius:14px;padding:10px;box-shadow:inset 0 0 0 3px #2a1530}
canvas{display:block;width:100%;aspect-ratio:160/100;image-rendering:pixelated;image-rendering:crisp-edges;border-radius:6px;background:#25163f}
.dlg{margin-top:12px;background:var(--box);border-radius:6px;padding:14px 16px 16px;min-height:150px;position:relative;cursor:pointer;
  box-shadow:0 0 0 3px #fff,0 0 0 6px var(--box),inset 0 0 0 2px #3b3478}
.who{font:13px/1 "Press Start 2P",monospace;color:var(--sun);margin-bottom:10px;min-height:13px}
.txt{font-size:19px;line-height:1.4;min-height:54px;white-space:pre-line}
.title{font:clamp(17px,5.2vw,22px)/1.45 "Press Start 2P",monospace;color:#fff;text-align:center;margin:6px 0 4px;text-shadow:3px 3px 0 var(--acc)}
.sub{text-align:center;color:#d9cff7;margin:0 0 12px}
.row{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;margin-top:12px}
.btn{font:13px/1.2 "Press Start 2P",monospace;color:#fff;background:var(--acc);border:0;border-radius:4px;padding:12px 18px;min-height:44px;cursor:pointer;
  box-shadow:inset 0 -4px 0 #b81e63,inset 0 3px 0 #ff86b6,0 0 0 3px #fff;transition:transform .15s}
.btn:active{transform:translateY(2px)}
.btn:focus-visible,#snd:focus-visible{outline:3px dashed var(--sun);outline-offset:4px}
.btn.ghost{background:#3b3478;box-shadow:inset 0 -4px 0 #26205a,inset 0 3px 0 #5a52a8,0 0 0 3px #fff}
.next{position:absolute;right:14px;bottom:10px;font:13px "Press Start 2P",monospace;color:var(--sun);animation:nudge 1s steps(2) infinite}
@keyframes nudge{50%{translate:0 3px}}
.choices{position:relative;height:120px;margin-top:8px}
.choices .btn{position:absolute;top:50%;transition:left .25s,top .25s,transform .2s}
#yes{left:12%;transform:translateY(-50%) scale(var(--grow,1));background:#2fbf71;box-shadow:inset 0 -4px 0 #1d8a50,inset 0 3px 0 #7ee6a8,0 0 0 3px #fff;z-index:3}
#no{left:58%;transform:translateY(-50%);z-index:2}
.note{font-size:18px;line-height:1.5;background:#fff7fb;color:#4a1a3a;border-radius:4px;padding:14px 16px;margin-top:4px;box-shadow:0 0 0 3px var(--acc)}
.note .sign{font:13px "Press Start 2P",monospace;color:var(--acc);display:block;margin-top:10px;text-align:right}
.hide{display:none!important}
.foot{text-align:center;font:13px "Press Start 2P",monospace;color:#7a2a54;margin-top:16px;letter-spacing:1px}
.dots{display:flex;justify-content:center;gap:16px;margin-top:12px}
.dots i{width:16px;height:16px;border-radius:50%;background:#ffd0e6;box-shadow:inset 0 -3px 0 #f2a6c8}
.dots i:nth-child(2){background:#8ff0c8;box-shadow:inset 0 -3px 0 #4fc79a}
@media (prefers-reduced-motion:reduce){.next{animation:none}.choices .btn{transition:none}}
</style>
</head>
<body>
<main class="shell" aria-label="A little pixel game for Narin">
  <div class="bar"><span>P1 <b>HONGLY</b></span><button id="snd" type="button" aria-pressed="true">Sound on</button><span>P2 <b>NARIN</b></span></div>
  <div class="bezel">
    <canvas id="scr" width="160" height="100" aria-label="Pixel scene of Hongly and Narin in a park at sunset"></canvas>
    <section class="dlg" id="dlg" aria-live="polite">
      <div id="titleView">
        <p class="title">A little quest<br>for Narin</p>
        <p class="sub">A one-level game, made just for you.</p>
        <div class="row"><button class="btn" id="start" type="button">▶ Press start</button></div>
      </div>
      <div id="talkView" class="hide">
        <div class="who" id="who"></div>
        <div class="txt" id="txt"></div>
        <span class="next hide" id="next" aria-hidden="true">▼</span>
        <div class="choices hide" id="choices">
          <button class="btn" id="yes" type="button">YES</button>
          <button class="btn" id="no" type="button">NO</button>
        </div>
        <div class="row hide" id="endRow">
          <button class="btn" id="noteBtn" type="button">Read my note</button>
          <button class="btn ghost" id="again" type="button">Play again</button>
        </div>
        <div class="note hide" id="note">Narin, thank you for saying yes.
I promise to make you laugh, to listen to you, and to grow together with you, one level at a time.
<span class="sign">— Hongly</span></div>
      </div>
    </section>
  </div>
  <div class="dots" aria-hidden="true"><i></i><i></i></div>
  <p class="foot">♥ PRESS A TO LOVE ♥</p>
</main>

<script>
{
const cv=document.getElementById('scr'),g=cv.getContext('2d');
const W=160,H=100,GROUND=80;
g.imageSmoothingEnabled=false;
const calm=matchMedia('(prefers-reduced-motion: reduce)').matches;
const $=id=>document.getElementById(id);

/* ---------- sprites (one character = one pixel) ---------- */
const BOY_PAL={k:'#2a1626',h:'#3b2418',s:'#ffd2b0',e:'#24131d',r:'#ff9bbb',b:'#5b8def',w:'#ffffff',p:'#3d3a72',o:'#1f1b24'};
const GIRL_PAL={k:'#2a1626',h:'#24140f',s:'#ffd8bb',e:'#24131d',r:'#ff8fb1',d:'#ff6fae',w:'#ffffff',o:'#7a2950'};
const BOY_TOP=[
'...kkkkkk...','..khhhhhhk..','.khhhhhhhhk.','.khhsshsshk.','.kssssssssk.','.ksesssessk.',
'.krssssssrk.','.ksssksssk..','..kssssssk..','....kssk....','..kbbbbbbk..','.kbbbwwbbbk.',
'kbkbbbbbbkbk','kskbbbbbbksk','.k.kppppk.k.','...kppppk...'];
const BOY_LEGS=[
 ['...kpkkpk...','...kpkkpk...','..kookkook..','..kkkkkkkk..'],
 ['..kpk..kpk..','..kpk..kpk..','.kook..kook.','.kkkk..kkkk.']];
const GIRL=[
'...kkkkkk...','..khhhhhhk..','.khhhhhhhhk.','khhhsshsshhk','khsssssssshk','khsesssseshk',
'khrssssssrhk','khssskkssshk','khhhksskhhhk','khhkddddkhhk','khkddwwddkhk','kkddddddddkk',
'kskddddddksk','..kddddddk..','.kddddddddk.','.kddddddddk.','kddddddddddk','kkkkkkkkkkkk',
'...ksk.ksk..','...ksk.ksk..','..kook.kook.','..kkkk.kkkk.'];
const FLOWERS=['.r.y.r.','rrryrrr','.rygyr.','..ggg..','.wwgww.','..www..','...w...'];
const FL_PAL={r:'#ff5c9a',y:'#ffd96a',g:'#3fa35a',w:'#fff3f8'};
const MINI=['rr.rr','rrrrr','.rrr.','..r..'];
const BIG=['.kk.kk.','krrkrrk','krrrrrk','.krrrk.','..krk..','...k...'];
const HEART_PAL={r:'#ff5c9a',k:'#ffffff'};

function spr(rows,pal,x,y,sc=1){
  x=Math.round(x);y=Math.round(y);
  for(let j=0;j<rows.length;j++){const r=rows[j];
    for(let i=0;i<r.length;i++){const c=r[i];if(c==='.')continue;g.fillStyle=pal[c];g.fillRect(x+i*sc,y+j*sc,sc,sc)}}
}
const px=(x,y,c,w=1,h=1)=>{g.fillStyle=c;g.fillRect(Math.round(x),Math.round(y),w,h)};

/* ---------- background ---------- */
const SKY=['#25163f','#331c55','#4a2468','#6b2f7a','#93397f','#c24f86','#ee7590','#ffa08f'];
const rnd=(a,b)=>a+Math.random()*(b-a);
const stars=Array.from({length:34},()=>({x:rnd(0,W)|0,y:rnd(1,40)|0,p:rnd(0,200)|0}));
const grass=Array.from({length:26},(_,i)=>({x:(i*37+11)%W,y:83+(i*7)%15,c:['#ff8fc0','#ffd96a','#ffffff','#b89cff'][i%4]}));
const flies=Array.from({length:7},()=>({x:rnd(10,150),y:rnd(55,78),p:rnd(0,6)}));
function scene(f){
  SKY.forEach((c,i)=>px(0,i*10,c,W,10));
  for(const s of stars){if(calm||(f+s.p)%140>10)px(s.x,s.y,s.y<20?'#ffffff':'#ffe6f2')}
  for(let dy=-7;dy<=7;dy++)for(let dx=-7;dx<=7;dx++)if(dx*dx+dy*dy<=49)px(132+dx,16+dy,'#fff3c4');
  px(129,13,'#f1dfa6',2,2);px(135,18,'#f1dfa6',2,1);px(131,20,'#f1dfa6');
  for(let x=0;x<W;x++){const h=66+4*Math.sin(x/14)+3*Math.sin(x/6+1);px(x,h,'#4a2458',1,GROUND-h)}
  for(let x=0;x<W;x++){const h=73+2*Math.sin(x/9+2);px(x,h,'#341a46',1,GROUND-h)}
  px(0,GROUND,'#3f8f5a',W,H-GROUND);px(0,GROUND,'#7fe08a',W,1);px(0,GROUND+1,'#58b86c',W,1);
  for(const p of grass){px(p.x,p.y,p.c);px(p.x,p.y+1,'#2d6e43')}
  px(8,50,'#5a3424',5,30);px(7,78,'#5a3424',7,2);
  for(const [cx,cy,r,c] of [[10,44,11,'#2f6f4a'],[4,48,7,'#2f6f4a'],[17,48,7,'#2f6f4a'],[10,42,8,'#3f9a5a']])
    for(let dy=-r;dy<=r;dy++)for(let dx=-r;dx<=r;dx++)if(dx*dx+dy*dy<=r*r)px(cx+dx,cy+dy,c);
  for(const [x,y] of [[5,40],[13,37],[16,45],[8,48],[2,45],[11,43]])px(x,y,'#ffb3d1',2,2);
  for(const fl of flies){const a=f/40+fl.p;const on=calm||Math.sin(f/12+fl.p*3)>-.3;if(on)px(fl.x+Math.sin(a)*4,fl.y+Math.cos(a*1.3)*3,'#fff59a')}
}

/* ---------- state ---------- */
let S='title',f=0,boyX=24,girlX=124,walkStep=0,flowers=false,happy=0,hearts=[],sparks=[],blinkB=0,blinkG=0;
const BOY_STOP=girlX-17,HUG=girlX-13;

function people(){
  const walking=S==='walk'&&boyX<BOY_STOP;
  const bob=walking&&(walkStep>>3)%2?1:0;
  const jumpB=happy?Math.max(0,Math.sin(happy*0.16))*6:0;
  const jumpG=happy?Math.max(0,Math.sin(happy*0.16+1.2))*7:0;
  const bp=blinkB>0?{...BOY_PAL,e:BOY_PAL.s}:BOY_PAL, gp=blinkG>0?{...GIRL_PAL,e:GIRL_PAL.s}:GIRL_PAL;
  const by=GROUND-20-bob-jumpB, gy=GROUND-22-jumpG;
  px(boyX+2,GROUND,'rgba(0,0,0,.25)',8,1);px(girlX+1,GROUND,'rgba(0,0,0,.25)',10,1);
  spr(BOY_TOP,bp,boyX,by);spr(BOY_LEGS[walking?((walkStep>>3)%2):0],bp,boyX,by+16);
  spr(GIRL,gp,girlX,gy);
  px(girlX+8,gy,'#ff3f8e',4,2);px(girlX+9,gy+2,'#ff3f8e',2,1);px(girlX+9,gy,'#ffd0e6');
  if(flowers&&!happy)spr(FLOWERS,FL_PAL,boyX+10,by+6);
  if(S==='ask'&&f%60<40){px(girlX+5,gy-8,'#fff',2,1);px(girlX+7,gy-7,'#fff');px(girlX+6,gy-6,'#fff');px(girlX+6,gy-4,'#fff')}
}
function particles(){
  hearts=hearts.filter(h=>(h.y-=h.v,h.x+=Math.sin(h.y/6)*.3,--h.l>0));
  for(const h of hearts)spr(MINI,{r:h.c},h.x,h.y);
  sparks=sparks.filter(p=>(p.x+=p.vx,p.y+=p.vy,p.vy+=.03,--p.l>0));
  for(const p of sparks)px(p.x,p.y,p.l<8?'#ffffff':p.c);
}
function burst(){
  const x=rnd(24,136),y=rnd(10,34),c=['#ff5c9a','#ffd96a','#8ff0c8','#b89cff','#ff9f6b'][Math.random()*5|0];
  const n=calm?12:26;
  for(let i=0;i<n;i++){const a=i/n*Math.PI*2,sp=rnd(.5,1.1);sparks.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,l:rnd(30,46),c})}
  beep(rnd(180,260),.12,'triangle',.03);
}
function loop(){
  f++;
  if(--blinkB<-rnd(140,260))blinkB=6; if(--blinkG<-rnd(140,260))blinkG=6;
  if(S==='walk'&&boyX<BOY_STOP){boyX+=.38;walkStep++;if(walkStep%16===0)beep(110,.04,'square',.02);if(boyX>=BOY_STOP)arrive()}
  if((S==='ask'||S==='lines')&&f%(calm?60:28)===0)hearts.push({x:(boyX+girlX)/2+rnd(-3,8),y:56,v:rnd(.18,.3),l:150,c:Math.random()<.5?'#ff5c9a':'#ff9bbb'});
  if(S==='yes'){happy++;if(boyX<HUG)boyX+=.3;if(happy%(calm?70:30)===1)burst();if(happy%10===0&&happy<400)hearts.push({x:rnd(30,140),y:rnd(60,80),v:rnd(.3,.6),l:120,c:'#ff5c9a'})}
  scene(f);particles();people();
  if(S==='yes'&&happy>60){const sc=(happy>>4)%2?3:2;spr(BIG,HEART_PAL,(boyX+girlX)/2+6-3.5*sc,40-6*sc-4)}
  requestAnimationFrame(loop);
}

/* ---------- sound ---------- */
let ac=null,soundOn=true;
function beep(freq,dur=.06,type='square',vol=.035,when=0){
  if(!soundOn)return;
  try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();
    const o=ac.createOscillator(),gn=ac.createGain(),t0=ac.currentTime+when;
    o.type=type;o.frequency.value=freq;gn.gain.setValueAtTime(vol,t0);gn.gain.exponentialRampToValueAtTime(.0001,t0+dur);
    o.connect(gn).connect(ac.destination);o.start(t0);o.stop(t0+dur+.02)}catch(e){}
}
const tune=notes=>notes.forEach((n,i)=>beep(n,.16,'square',.04,i*.13));
$('snd').addEventListener('click',()=>{soundOn=!soundOn;$('snd').textContent=soundOn?'Sound on':'Sound off';$('snd').setAttribute('aria-pressed',soundOn);if(soundOn)beep(880)});

/* ---------- dialog ---------- */
let typer=null,typing=false,full='',onDone=null,step=0;
function say(who,text,done){
  $('who').textContent=who;$('txt').textContent='';full=text;onDone=done||null;typing=true;$('next').classList.add('hide');
  let i=0;clearInterval(typer);
  typer=setInterval(()=>{i++;$('txt').textContent=text.slice(0,i);if(i%2&&text[i-1]!==' ')beep(620+Math.random()*120,.03,'square',.02);
    if(i>=text.length)finish()},38);
}
function finish(){clearInterval(typer);typing=false;$('txt').textContent=full;const d=onDone;onDone=null;d&&d()}
const LINES=[
 ['HONGLY','Hi Narin! It\'s me.'],
 ['HONGLY','Every time we talk, my heart levels up.'],
 ['HONGLY','You make my days brighter, like a power-up I never want to lose.'],
 ['HONGLY','So I walked all the way here to ask you one thing...'],
];
const NO_TEXT=['Are you sure?','Think again!','Pretty please?','Error 404: NO not found','The NO button is tired...'];
const NO_SAY=['Wait... I think you pressed the wrong button.','Hmm, the YES button is right there!','I will keep asking, you know.','My heart: loading... loading...','Okay, last chance! Please?'];
let noCount=0;

function show(view){$('titleView').classList.toggle('hide',view!=='title');$('talkView').classList.toggle('hide',view==='title')}
function arrive(){S='lines';step=0;nextLine()}
function nextLine(){
  if(step<LINES.length){const [w,t]=LINES[step++];say(w,t,()=>$('next').classList.remove('hide'))}
  else ask();
}
function ask(){
  S='ask';flowers=true;tune([392,523]);
  say('HONGLY','Narin, will you be my girlfriend?',()=>{$('choices').classList.remove('hide');$('yes').focus({preventScroll:true})});
}
$('start').addEventListener('click',()=>{
  beep(523,.08);beep(784,.12,'square',.04,.08);
  show('talk');S='walk';say('','Hongly is walking to Narin...');
});
$('dlg').addEventListener('click',e=>{
  if(e.target.closest('button')||S==='title')return;
  if(typing){finish();return}
  if(S==='lines'){beep(880,.04);nextLine()}
});
document.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&S==='lines'&&!e.target.closest('button')){e.preventDefault();typing?finish():nextLine()}});

function dodge(){
  const box=$('choices'),b=$('no'),y=$('yes');
  const w=box.clientWidth-b.offsetWidth,h=box.clientHeight-b.offsetHeight;
  const br=box.getBoundingClientRect(),yr=y.getBoundingClientRect(),bw=b.offsetWidth,bh=b.offsetHeight;
  let x,t,tries=0;
  do{x=Math.random()*w;t=Math.random()*h;tries++}
  while(tries<40&&x<yr.right-br.left+8&&x+bw>yr.left-br.left-8&&t<yr.bottom-br.top+4&&t+bh>yr.top-br.top-4);
  b.style.left=x+'px';b.style.top=(t+b.offsetHeight/2)+'px';
}
$('no').addEventListener('pointerenter',e=>{if(e.pointerType==='mouse'&&noCount<NO_TEXT.length)dodge()});
$('no').addEventListener('click',()=>{
  if(noCount>=NO_TEXT.length){yes();return}
  beep(150,.15,'sawtooth',.03);
  $('no').textContent=NO_TEXT[noCount];$('txt').textContent=NO_SAY[noCount];noCount++;
  $('yes').style.setProperty('--grow',Math.min(1+noCount*.16,1.8));
  if(noCount>=NO_TEXT.length){$('no').textContent='YES';$('no').style.background='#2fbf71'}
  dodge();
});
$('yes').addEventListener('click',yes);
function yes(){
  if(S==='yes')return;
  S='yes';happy=1;$('choices').classList.add('hide');
  tune([523,659,784,1047,784,1047]);
  say('QUEST COMPLETE!','Narin joined Hongly\'s party. ♥\nPlayer 2 is now my girlfriend!',()=>$('endRow').classList.remove('hide'));
}
$('noteBtn').addEventListener('click',()=>{beep(988,.08);$('note').classList.remove('hide');$('endRow').querySelector('#noteBtn').classList.add('hide')});
$('again').addEventListener('click',()=>{
  S='title';boyX=24;walkStep=0;flowers=false;happy=0;hearts=[];sparks=[];noCount=0;clearInterval(typer);typing=false;
  $('no').textContent='NO';$('no').style.cssText='';$('yes').style.removeProperty('--grow');
  ['choices','endRow','note','next'].forEach(id=>$(id).classList.add('hide'));$('noteBtn').classList.remove('hide');
  show('title');$('start').focus({preventScroll:true});
});
loop();
}
</script>
</body>
</html>
